name: Предлог за крошна
description: Место, настан, приказна или исправка од заедницата.
title: '[Предлог] '
body:
  - type: markdown
    attributes:
      value: 'Ова е јавна пријава. Внесувајте само јавни информации. Не споделувајте лични податоци или фотографии од деца.'
  - type: dropdown
    id: type
    attributes:
      label: Тип на предлог
      options: [Место, Настан, Работилница, Приказна, Исправка, Соработка]
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Официјален извор
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Детали
      description: Маало, потврдена програма, за кого е, и што треба дополнително да се провери.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Приватност
      options:
        - label: Не внесувам приватни информации или податоци за деца.
          required: true
